name: Build & Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

# master 上短时间内连续 push 只会出一次包：同一 group 的新 run 启动即取消旧 run，
# 而被取消的那次通常还卡在下面的静默等待里，几乎不耗构建资源。
# v* tag 与 workflow_dispatch 各自独立 group，不会被去抖。
concurrency:
  group: ${{ github.ref == 'refs/heads/master' && 'master' || github.ref }}
  cancel-in-progress: true

env:
  # master push 后出包前的静默等待秒数：期间再来 push 本次构建就会被取消。
  # 调小更激进，0 关闭去抖。
  MASTER_DEBOUNCE_SECONDS: '300'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Wait for master to settle
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          seconds="${MASTER_DEBOUNCE_SECONDS:-0}"
          echo "等待 ${seconds}s 静默期；期间若有新 push，本 run 会被取消（去抖）"
          sleep "${seconds}"

      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/bgmlite.jks

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        env:
          KEYSTORE_FILE: bgmlite.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Update Latest Prerelease
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build (开发版)"
          prerelease: true
          overwrite_files: true
          body: |
            master 分支自动构建的开发版，每次 push 覆盖更新（tag 位置不代表构建内容）。

            稳定版请下载正式 Release（v* 标签）。
          files: app/build/outputs/apk/release/app-release.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
